# Local development: cloudsync + Keycloak behind Caddy, matching production TLS.
# Browser connections use HTTPS; traffic inside the Compose network uses HTTP.
# Production hostnames and the observability stack stay in docker-compose.yml.
#
# Start:
#   docker compose -f docker-compose.local.yml up --build -d
#
# First time, export Caddy's local CA certificate and trust it on your host/browser:
#   docker compose -f docker-compose.local.yml cp reverse-proxy:/data/caddy/pki/authorities/local/root.crt /tmp/cloudsync-local-ca.crt
# See https://caddyserver.com/docs/running#local-https-with-docker for trust commands.
# Caddy runs in a container, so it cannot install trust on your host automatically.
#
# Create a test user at https://localhost:8081/admin (admin / admin):
#   Select realm "cloudsync" -> Users -> Add user, then set email and password.
# Open https://localhost:3050/login and click "Sign in with Keycloak".
# Use HTTPS explicitly; the local Caddyfile disables automatic HTTP redirects.
#
# Stop while keeping users, files and certificates:
#   docker compose -f docker-compose.local.yml down
# Adding -v deletes ALL local stack data, including files, users and Caddy's CA.
# After that, reimport the newly generated CA certificate into your trust store.
#
# Keycloak imports the local realm only when that realm does not already exist.
# For an existing realm, add https://localhost:3050/auth/callback to the cloudsync
# client's valid redirect URIs manually to preserve existing users and data.

services:
  cloudsync:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Static-token fallback works alongside OIDC; development credentials only.
      - CLOUDSYNC_TOKEN=local-dev-token
      # Production must use an independent, private random signing secret.
      - CLOUDSYNC_SESSION_SIGNING_SECRET=local-dev-session-signing-secret
      - CLOUDSYNC_HOST=0.0.0.0
      - CLOUDSYNC_STORAGE_DIR=/data/files
      - CLOUDSYNC_STAGING_DIR=/data/staging
      - CLOUDSYNC_DBNAME=/data/data.redb
      - CLOUDSYNC_DEFAULT_TENANT_ID=local-tenant
      - CLOUDSYNC_DEFAULT_USER_ID=local-user
      # Public issuer must match the token iss claim and browser-facing URL.
      - CLOUDSYNC_OIDC_ISSUER=https://localhost:8081/realms/cloudsync
      # Container localhost points to itself. Use Compose DNS for discovery;
      # non-strict backchannel URLs keep token/JWKS requests on internal HTTP.
      - CLOUDSYNC_OIDC_DISCOVERY_URL=http://keycloak:8080/realms/cloudsync
      - CLOUDSYNC_OIDC_AUDIENCE=cloudsync
      # Pin HTTPS for login callbacks and Secure session cookies.
      - CLOUDSYNC_PUBLIC_BASE_URL=https://localhost:3050
      - RUST_LOG=cloudsync_server=debug
    volumes:
      - cloudsync_data:/data
    depends_on:
      - keycloak
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      # Allow internal discovery to advertise reachable backend endpoints.
      - KC_HOSTNAME_STRICT_BACKCHANNEL=false
      # Caddy terminates TLS; Keycloak listens on HTTP inside Compose only.
      - KC_HTTP_ENABLED=true
      # Keycloak 24 hostname v1: full frontend URL fixes scheme, host and port.
      # Cannot be combined with KC_HOSTNAME.
      - KC_HOSTNAME_URL=https://localhost:8081
      # Trust the forwarded scheme/host/port supplied by Caddy.
      - KC_PROXY_HEADERS=xforwarded
    command:
      - start-dev
      - --import-realm
    volumes:
      # Local callbacks without changing the production realm bootstrap.
      # Import applies only if the realm does not already exist.
      - ./keycloak/realm-cloudsync.local.json:/opt/keycloak/data/import/realm-cloudsync.json:ro
      - keycloak_data:/opt/keycloak/data
    restart: unless-stopped
  reverse-proxy:
    image: caddy:2.11.2-alpine@sha256:fce4f15aad23222c0ac78a1220adf63bae7b94355d5ea28eee53910624acedfa
    # Only Caddy publishes ports; bind to loopback for local development.
    ports:
      - 127.0.0.1:3050:3050
      - 127.0.0.1:8081:8081
    volumes:
      - ./caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      # Persist the local CA so certificates remain trusted across restarts.
      - caddy_local_data:/data
      - caddy_local_config:/config
    depends_on:
      - cloudsync
      - keycloak
    restart: unless-stopped
volumes:
  cloudsync_data: null
  keycloak_data: null
  caddy_local_data: null
  caddy_local_config: null
